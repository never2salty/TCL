name: Build TCL Home
on:
  push:
    paths: ["home/**", ".github/workflows/home.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - name: SDK packages
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-30" "build-tools;34.0.0" >/dev/null
      - name: Build
        run: ./home/build.sh
      - uses: actions/upload-artifact@v4
        with: { name: tcl-home, path: home/tcl-home.apk }
      - name: Commit the APK
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add home/tcl-home.apk
          git diff --cached --quiet && exit 0
          git commit -m "Build home/tcl-home.apk [skip ci]"
          git push
